[package]
name = "syc"
version = "0.1.29"
edition = "2021"
rust-version = "1.77"
description = "Streaming archiver + compressor in pure-ish Rust, tuned for modest hardware"
license = "MIT OR Apache-2.0"

[dependencies]
zstd = { version = "0.13", default-features = false, features = ["zstdmt", "zdict_builder"] }
xz2 = "0.1"
walkdir = "2.5"
glob = "0.3"
anyhow = "1.0"
byteorder = "1.5"
crc32fast = "1.4"
ppmd-rust = "1.4"
blake3 = "1.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(unix)'.dependencies]
xattr = "1.3"
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
xattr = "1.3"

[build-dependencies]
cc = "1.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Rust 1.77.2 (last release with Windows 7 support) can't build ppmd-rust 1.5
# as published: it uses `&raw mut` and the prelude `align_of`. Vendored copy
# with those rewritten to `addr_of_mut!` / `core::mem::align_of`; same code.
[patch.crates-io]
ppmd-rust = { path = "vendor/ppmd-rust" }
